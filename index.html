<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d',{alpha:false});
let MAP,MW,MH,TH,mapI=0;try{mapI=+localStorage.getItem('aurora-fps-map')||0}catch(e){}
const R=.25,COL=['#4f9dff','#ff5c7a','#ffc94a','#5eead4','#a78bfa','#ff9f43'];
const MAPS=[{n:"Neon Foundry",t:{f0:"#0e1426",f1:"#10172b",w0:"#18213f",w1:"#26345f",w2:"#34467a",ac:"#5eead4"}},{n:"Desert Ruins",t:{f0:"#2b2218",f1:"#2f261b",w0:"#4a3826",w1:"#6b5136",w2:"#8a6c48",ac:"#ffb454"}},{n:"Frost Station",t:{f0:"#0e1a28",f1:"#10202f",w0:"#1f3a55",w1:"#31577a",w2:"#4f7fa6",ac:"#9fe3ff"}},{n:"Toxic Lab",t:{f0:"#0c1a13",f1:"#0e1e16",w0:"#17382a",w1:"#22503b",w2:"#2f6b4f",ac:"#7cfc8a"}},{n:"Crimson Forge",t:{f0:"#1a0e12",f1:"#1e1015",w0:"#3d1822",w1:"#5c2432",w2:"#7d3345",ac:"#ff5d6d"}}];
const rngf=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function genMap(st,seed){
 for(let att=0;att<80;att++){
  const rnd=rngf(seed+att*7919),R=(a,b)=>a+Math.floor(rnd()*(b-a+1)),ar=.62+rnd()*1.75,A=R(480,720);
  let W=Math.round(Math.sqrt(A*ar)),H=Math.round(A/W);W=Math.max(20,Math.min(44,W));H=Math.max(14,Math.min(30,H));
  if(st===2){W=Math.max(22,W);H=Math.max(18,H)}if(st===3){W=Math.max(28,W);H=Math.min(24,H)}
  const g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++)g[y].push(x===0||y===0||x===W-1||y===H-1?'#':'.')}
  const im=(x,y)=>st===2?[[x,y],[W-1-x,y]]:[[x,y],[W-1-x,H-1-y]],set=(x,y,c)=>{for(const[a,b]of im(x,y))g[b][a]=c};
  const put=(cs,c)=>{for(const[x,y]of cs){if(x<2||x>W-3||y<2||y>H-3)return false;for(const[a,b]of im(x,y))if(g[b][a]!=='.')return false}for(const[x,y]of cs)set(x,y,c);return true};
  const seg=n=>{const x=R(2,W-3),y=R(2,H-3),h=rnd()<.5;return Array.from({length:n},(_,i)=>h?[x+i,y]:[x,y+i])};
  const many=(k,fn)=>{let ok=0;for(let i=0;i<400&&ok<k;i++)if(fn())ok++},sc=W*H/600,K=n=>Math.max(1,Math.round(n*sc)),pads=k=>many(k,()=>put([[R(2,W-3),R(2,H-3)]],'+'));
  const wl=(a,b)=>many(K(a),()=>put(seg(R(b[0],b[1])),'#')),cr=k=>many(K(k),()=>put(seg(R(1,2)),'C'));
  if(st===0){many(K(6),()=>{const n=R(4,8),c=seg(n);if(rnd()<.8)c.splice(R(1,n-2),1);return put(c,'#')});wl(3,[2,3]);cr(4);pads(K(3))}
  else if(st===1){wl(10,[2,4]);many(K(3),()=>{const x=R(3,W-5),y=R(3,H-5);return put([[x,y],[x+1,y],[x,y+1]],'#')});many(K(5),()=>put(seg(R(1,3)),'C'));wl(3,[1,1]);pads(K(2))}
  else if(st===2){const bw=Math.max(8,Math.round(W*.36)),bh=Math.max(5,Math.round(H*.3)),x0=Math.floor((W-bw)/2),x1=W-1-x0,y0=Math.floor((H-bh)/2),y1=y0+bh-1;
   for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g[y][x]=(y===y0||y===y1||x===x0||x===x1)?'#':'.';
   const my=y0+(bh>>1);set(x0,my,'D');set(x0,my+1,'D');const cx=(W-1)>>1;set(cx,y0,'D');set(cx+1,y0,'D');put([[x0+2,y0+2]],'C');put([[x0+2,y1-2]],'C');wl(9,[1,3]);cr(5);pads(K(2))}
  else if(st===3){const p=Math.max(2,Math.floor(W/11)),xs=new Set;for(let i=0;i<p;i++)xs.add(Math.max(3,Math.round((i+1)*W/(2*p+1))));
   for(const x of xs){for(let y=1;y<H-1;y++)set(x,y,'#');const rs=[];while(rs.length<3){const r=R(2,(H>>1)-2);if(!rs.includes(r))rs.push(r)}set(x,rs[0],'D');set(x,rs[1],'.');set(x,rs[2],'D');set(x,(H>>1)-1,'.')}
   wl(5,[2,3]);cr(3);pads(K(2))}
  else{const cx=(W-1)/2,cy=(H-1)/2;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.hypot((x-cx)/(W/2-.3),(y-cy)/(H/2-.3));
    if(d>.94)g[y][x]='#';else if(d>=.38&&d<=.5)g[y][x]=(Math.abs(x-cx)<=1||Math.abs(y-cy)<=1)?'D':'#';else if(Math.abs(x-cx)<=.5&&Math.abs(y-cy)<=.5)g[y][x]='C'}
   wl(4,[1,3]);cr(3);pads(K(2))}
  let tot=0,open=0,dots=0;const cells=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=g[y][x];if(c!=='#')open++;if(c==='.')dots++;if(c==='.'||c==='+'||c==='D')cells.push(y*W+x)}
  const seen=new Set([cells[0]]),stk=[cells[0]];while(stk.length){const v=stk.pop(),x=v%W,y=(v/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(a<0||b<0||a>=W||b>=H)continue;const k=b*W+a,c=g[b][a];if(!seen.has(k)&&(c==='.'||c==='+'||c==='D')){seen.add(k);stk.push(k)}}}
  if(seen.size===cells.length&&open/(W*H)>(st===4?.5:.68)&&dots>30)return g.map(r=>r.join(''))}
 const r=[];for(let y=0;y<20;y++)r.push(y===0||y===19?'#'.repeat(28):'#'+'.'.repeat(26)+'#');r[9]=r[9].slice(0,13)+'CC'+r[9].slice(15);r[10]=r[9];return r}

// sp = bullet speed (cells/s), cd = delay between shots, mag = shots per reload, rl = reload seconds
const WP=[{n:'Sniper',sp:45,dmg:100,mag:2,rl:2.5,cd:1,per:1,rc:35,hp:80,mv:1.2,pel:1,spr:0},{n:'Rifle',sp:18,dmg:6,mag:30,rl:.5,cd:.11,rc:16,pel:1,spr:0},{n:'Shotgun',sp:23.4,dmg:14,mag:3,rl:1,cd:.6,rc:15,slow:1,pel:5,spr:35},{n:'Minigun',sp:30,dmg:7,mag:999,rl:0,cd:.1,rc:0,heat:1,hp:120,mv:.92,dm:.5,kb:2,jit:10,pel:1,spr:0},{n:'Magnum',sp:26,dmg:4,mag:6,rl:1.2,cd:.1,rc:0,hp:80,dc:.8,ch:1,pel:1,spr:0}];
let DM={},DL=[];
function loadMap(i,seed){i=((i%6)+6)%6;mapI=i;if(seed===undefined)seed=Math.random()*2147483647|0;const st=i===5?seed%5:i;TH=MAPS[st].t;MAP=genMap(st,seed);MW=MAP[0].length;MH=MAP.length;DM={};DL=[];
 MAP.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='D'||c==='C'){const m=c==='C'?4:3,d={x,y,cx:x+.5,cy:y+.5,hp:m,m,c:c==='C',o:0,op:0};DM[y*MW+x]=d;DL.push(d)}}));buildMap()}
const cl=v=>Math.max(-1,Math.min(1,+v||0));
function solid(x,y){if(x<0||y<0||x>=MW||y>=MH)return true;const c=MAP[y|0][x|0];if(c==='#')return true;if(c==='D'||c==='C'){const d=DM[(y|0)*MW+(x|0)];return d.hp>0&&d.o<=0}return false}
const free=(x,y)=>!(solid(x-R,y-R)||solid(x+R,y-R)||solid(x-R,y+R)||solid(x+R,y+R));
// ---------- host simulation ----------
let G=null,aim=0;
const fresh=id=>({id,x:1.5,y:1.5,a:0,hp:100,w:1,am:[2,30,3,999,6],rl:0,cd:0,rk:0,dk:0,dt:0,dcd:0,dx:0,dy:0,sl:0,rx:0,ry:0,ht:0,ho:0,uk:0,aq:0,au:0,sc:0,k:0,alive:true,gone:false,in:{mx:0,my:0,a:0,fire:0,r:0,d:0,u:0}});
function pickSpawns(n){const cells=[];for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(MAP[y][x]==='.')cells.push([x+.5,y+.5]);
 const out=[cells[Math.random()*cells.length|0]];
 while(out.length<n){let best=null,bd=-1;for(let i=0;i<40;i++){const c=cells[Math.random()*cells.length|0],d=Math.min(...out.map(o=>Math.hypot(o[0]-c[0],o[1]-c[1])));if(d>bd){bd=d;best=c}}out.push(best)}
 return out}
function newRound(){const g=G;DL.forEach(d=>{d.hp=d.m;d.o=0;d.op=0});g.bl=[];const ps=g.pl.filter(p=>!p.gone),sp=pickSpawns(ps.length);
 ps.forEach((p,i)=>{p.x=sp[i][0];p.y=sp[i][1];p.a=Math.atan2(MH/2-p.y,MW/2-p.x);p.hp=WP[p.w].hp||100;p.am=[2,30,3,999,6];p.rl=0;p.cd=0;p.dt=0;p.dcd=0;p.sl=0;p.rx=p.ry=0;p.ht=0;p.ho=0;p.aq=0;p.au=0;p.alive=true});
 g.st='count';g.tm=3}
const say=s=>{G.ms.push({t:performance.now(),s});if(G.ms.length>6)G.ms.shift()};
let sq=0,hostTick=null;const ev=(t,x,y,a,e=0)=>{G.ev.push({q:++sq,t,x,y,a,e});if(G.ev.length>30)G.ev.shift()};
const nm=id=>names[id]||'P'+(id+1);
function fire(p){const W=WP[p.w];if(W.heat&&p.ho>0)return;if(p.cd>0||(p.rl>0&&!(W.per&&p.am[p.w]>0)))return;if(p.am[p.w]<=0){p.rl=W.rl;return}
 if(!W.heat)p.am[p.w]--;p.cd=W.cd;ev(0,p.x,p.y,p.a,p.w+p.id*10);if(W.per?p.rl<=0:p.am[p.w]<=0)p.rl=W.rl;p.rx-=Math.cos(p.a)*W.rc/64;p.ry-=Math.sin(p.a)*W.rc/64;;
 for(let i=0;i<W.pel;i++){const a=p.a+(W.pel>1?(i/(W.pel-1)-.5)*W.spr*Math.PI/180:(W.jit?(Math.random()*2-1)*W.jit*Math.PI/180:0));
  G.bl.push({x:p.x+Math.cos(a)*.3,y:p.y+Math.sin(a)*.3,vx:Math.cos(a)*W.sp,vy:Math.sin(a)*W.sp,o:p.id,dmg:W.dmg,sl:W.slow||0,kb:W.kb||0,ch:W.ch||0,hb:p.au>0&&W.ch?3:1,l:30})}}
function los(p,o){const dx=o.x-p.x,dy=o.y-p.y,n=Math.ceil(Math.hypot(dx,dy)/.3);for(let k=1;k<n;k++)if(solid(p.x+dx*k/n,p.y+dy*k/n))return false;return true}
function autoT(p){let b=null,bd=1e9,l=null,ld=1e9;for(const o of G.pl){if(o===p||!o.alive||o.gone)continue;const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;b=o}if(d<ld&&los(p,o)){ld=d;l=o}}return l||b}
function step(dt){const g=G;
 for(const d of DL){let n=0;if(d.hp>0&&!d.c)for(const p of g.pl)if(p.alive&&Math.hypot(p.x-d.cx,p.y-d.cy)<1.3)n=1;d.o=n?.5:Math.max(0,d.o-dt)}
 const play=g.st==='play';
 for(const p of g.pl){if(p.gone||!p.alive)continue;const i=p.in;
